services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evaluai
      POSTGRES_USER: evaluai
      POSTGRES_PASSWORD: evaluai_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluai -d evaluai"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://evaluai:evaluai_local@postgres:5432/evaluai
      DEBUG: "False"
      SECRET_KEY: change-me-in-coolify
      FRONTEND_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GROQ_API_KEY: ""
      ADMIN_BOOTSTRAP_EMAIL: juliolopez4p@gmail.com
      ADMIN_BOOTSTRAP_PASSWORD: password123
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
