# EvaluAI — stack listo para Coolify/VPS y para pruebas locales con Docker.
#
# Coolify / producción: define en el panel (o .env junto a este archivo) al menos:
#   APP_ENV=production
#   SECRET_KEY= (>=32 caracteres aleatorios)
#   DATABASE_URL= (coherente con POSTGRES_* si cambias la contraseña)
#   FRONTEND_URL=  ALLOWED_ORIGINS=  REACT_APP_API_URL= (URL pública del API que verá el navegador)
#   GROQ_API_KEY=  y variables Wompi si aplica
#   ADMIN_BOOTSTRAP_* vacíos o seguros; ADMIN_BOOTSTRAP_ALLOW_IN_PROD=false
#
# Persistencia: volumenes postgres_data y backend_data (wiki / teacher_context bajo /app/data).
# No toca el motor de evaluación; solo orquestación.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evaluai}
      POSTGRES_USER: ${POSTGRES_USER:-evaluai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evaluai_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ → $ en el contenedor; usa las mismas variables que el servicio postgres.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://evaluai:evaluai_local@postgres:5432/evaluai}
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-False}
      # En APP_ENV=production el backend exige SECRET_KEY fuerte (>=32). Valor por defecto solo para local/docker.
      SECRET_KEY: ${SECRET_KEY:-local-only-secret-key-at-least-32-chars-long!}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_ALLOW_IN_PROD: ${ADMIN_BOOTSTRAP_ALLOW_IN_PROD:-false}
      WOMPI_ENVIRONMENT: ${WOMPI_ENVIRONMENT:-sandbox}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_EVENT_SECRET: ${WOMPI_EVENT_SECRET:-}
      WOMPI_SKIP_SIGNATURE_VALIDATION: ${WOMPI_SKIP_SIGNATURE_VALIDATION:-false}
    volumes:
      # TEACHER_CONTEXT_ROOT = /app/data/teacher_context (WORKDIR /app en backend/Dockerfile)
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PUBLISH_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        # En producción preferimos same-origin (Nginx proxya /api → backend).
        # Solo setea REACT_APP_API_URL si quieres apuntar a un host externo.
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLISH_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  backend_data:
