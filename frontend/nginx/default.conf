server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Nginx no siempre trae mapeo para .mjs (ES modules). pdf.js worker es .mjs y
    # si se sirve como application/octet-stream el navegador falla al importarlo.
    types {
        application/javascript mjs;
    }

    # Proxy same-origin API calls to backend service (docker network).
    # Esto evita CORS y permite que el frontend funcione aunque REACT_APP_API_URL no esté seteado.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Rutas legacy sin prefijo /api (compatibilidad con frontend antiguo)
    location ~ ^/(documentos|evaluaciones|agente|rubrics)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
